[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

# Read container logs via Docker API
[INPUT]
    Name              docker
    Tag               docker.*
    Unix_Path         /var/run/docker.sock

# Parse your Logback JSON (message is in 'log')
[FILTER]
    Name              parser
    Match             docker.*
    Key_Name          log
    Parser            json
    Reserve_Data      On
    Preserve_Key      Off

# Optional: only keep logs from your services (filter by container name)
# Uncomment if you want
# [FILTER]
#     Name   grep
#     Match  docker.*
#     Regex  container_name  orders-service

[OUTPUT]
    Name              es
    Match             docker.*
    Host              elasticsearch
    Port              9200
    Index             orders-service-logs
    Suppress_Type_Name On
    Replace_Dots      On
