kind: DaemonSet

image:
  repository: fluent/fluent-bit
  tag: 4.2.2
  pullPolicy: IfNotPresent

rbac:
  create: true

serviceAccount:
  create: true

config:
  service: |
    [SERVICE]
        Flush        1
        Log_Level    info
        HTTP_Server  On
        HTTP_Listen  0.0.0.0
        HTTP_Port    2020
        Parsers_File /fluent-bit/etc/parsers.conf

  inputs: |
    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*_order-platform_*.log
        multiline.parser  docker, cri
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  5

  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude On

  outputs: |
    [OUTPUT]
        Name                es
        Match               kube.*
        Host                host.docker.internal
        Port                9200
        Logstash_Format     On
        Logstash_Prefix     order-platform
        Replace_Dots        On
        Suppress_Type_Name  On
