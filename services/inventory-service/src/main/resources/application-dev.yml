# JPA + Hibernate
spring:

  # PostgresSQL
  datasource:
    url: jdbc:postgresql://localhost:5435/inventory
    username: inventory
    password: inventory

    hikari:
      pool-name: OrdersHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 20000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
      format_sql: false
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        use_sql_comments: false

  # Flyway
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

  # Kafka
  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: order-service
      auto-offset-reset: earliest

# Scheduler
orders:
  outbox:
    dispatcher:
      enabled: true
      fixed-delay: PT2S
      initial-delay: PT5S
    claim-mode: SKIP_LOCKED  # or ADVISORY

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operationsSorter: method
    tagsSorter: alpha

# Metrics
management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  metrics:
    export:
      otlp:
        enabled: false

# Custom properties
app:
  kafka:
    topics:
      reserve-stock-requested: inventory.reserve-stock-requested.v1
      stock-reserved: inventory.stock-reserved.v1
      stock-reservation-failed: inventory.stock-reservation-failed.v1
