# JPA + Hibernate
spring:

  #PostgresSQL
  datasource:
    url: jdbc:postgresql://localhost:5434/payments
    username: payments
    password: payments

    hikari:
      pool-name: OrdersHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 20000

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
      format_sql: false
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  # Flyway
  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

  # Kafka
  kafka:
    bootstrap-servers: localhost:9093
    consumer:
      group-id: payments-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: false
        spring.json.value.default.type: pl.xsware.payments.application.event.PaymentRequestedEvent
        spring.json.trusted.packages: "pl.xsware.payments.application"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

# Scheduler
outbox:
  publisher:
    enabled: true
    fixed-delay: PT15S
    initial-delay: PT10S
    lock-ttl: PT60S
  fake-provider:
    enabled: true
    fixed-delay: PT2S
    initial-delay: PT5S
    batch-size: 10
    success-rate: 0.8
    provider-name: FAKE_PSP
    lock-ttl: PT30S

# Metrics
management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

# Custom properties
app:
  kafka:
    topics:
      payment-requested: payments.payment-requested.v1
      payment-succeeded: payments.payment-succeeded.v1
      payment-failed: payments.payment-failed.v1
      payment-cancelled: payments.payment-cancelled.v1
