# JPA + Hibernate
spring:

  datasource:
    url: jdbc:postgresql://localhost:5434/payments
    username: payments
    password: payments

    hikari:
      pool-name: OrdersHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: validate
      format_sql: false
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    clean-disabled: true
    locations: classpath:db/migration

# Metrics
management:
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
